name: Build El Jumbo playlist
on:
  workflow_dispatch:
  push:
    paths:
      - 'sources/approved_channels.json'
      - 'tools/build_playlist.py'
      - '.github/workflows/update-playlist.yml'
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_playlist.py
      - name: Commit playlist if changed
        run: |
          if ! git diff --quiet -- El_Jumbo_Free_TV.m3u; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add El_Jumbo_Free_TV.m3u
            git commit -m "Update generated El Jumbo playlist"
            git push
          fi
