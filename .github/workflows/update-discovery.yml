name: Update public discovery playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_discovery.py
      - name: Commit refreshed discovery playlist
        run: |
          if ! git diff --quiet -- El_Jumbo_Discovery.m3u || [ ! -f El_Jumbo_Discovery.m3u ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add El_Jumbo_Discovery.m3u
            git diff --cached --quiet || (git commit -m "Refresh public discovery playlist" && git push)
          fi
